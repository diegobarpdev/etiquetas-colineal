services:
  # Postgres local opcional (perfil dev). Producción usa Odoo RO.
  postgres:
    image: postgres:16-alpine
    container_name: etiquetas-colineal-db
    restart: unless-stopped
    profiles:
      - dev
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: colineal
      POSTGRES_PASSWORD: colineal
      POSTGRES_DB: etiquetas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colineal -d etiquetas"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: etiquetas-colineal-app
    restart: unless-stopped
    shm_size: '1gb'
    ports:
      - "3000:3000"
      - "3010:3010"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      WEB_PORT: 3000
      API_PORT: 3010
      PUBLIC_URL: ${PUBLIC_URL:-}

volumes:
  postgres_data:
