services:
  postgres:
    image: postgres:16-alpine
    container_name: etiquetas-colineal-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: colineal
      POSTGRES_PASSWORD: colineal
      POSTGRES_DB: etiquetas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colineal -d etiquetas"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: etiquetas-colineal-app
    restart: unless-stopped
    shm_size: '1gb'
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://colineal:colineal@postgres:5432/etiquetas?schema=public
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-}
      SEED_ON_START: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
